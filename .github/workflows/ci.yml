name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # The install script is the first thing a new user runs, and it runs through
  # `curl | sh` on shells this project does not choose. Lint it as POSIX sh and
  # prove the checksum gate holds under sh, bash and zsh alike — an unquoted
  # command in a variable, for instance, behaves differently under zsh.
  install-script:
    name: install script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -s sh scripts/install.sh
      - name: Checksum gate holds in every shell
        run: |
          set -eu
          sed '$ d' scripts/install.sh > /tmp/lib.sh
          cat > /tmp/ck.sh <<'EOF'
          . /tmp/lib.sh
          cd "$(mktemp -d)"
          printf 'payload' > a.tar.gz
          sha256sum a.tar.gz > a.tar.gz.sha256
          (verify_checksum "$PWD/a.tar.gz" "$PWD/a.tar.gz.sha256" >/dev/null 2>&1) ||
            { echo "intact archive was rejected"; exit 1; }
          printf 'tampered' > a.tar.gz
          if (verify_checksum "$PWD/a.tar.gz" "$PWD/a.tar.gz.sha256" >/dev/null 2>&1); then
            echo "tampered archive was accepted"; exit 1
          fi
          EOF
          sudo apt-get install -y --no-install-recommends zsh >/dev/null
          for shell in sh bash zsh; do
            "$shell" /tmp/ck.sh || { echo "failed under $shell"; exit 1; }
            echo "checksum gate holds under $shell"
          done
      - name: Install the published release end to end
        run: |
          set -eu
          MEMORYLAKE_INSTALL_DIR="$PWD/testbin" sh scripts/install.sh | tee out.txt
          "$PWD/testbin/memorylake" --version

          # A CI step has no controlling terminal, which is exactly the case the
          # guided setup must detect: it has to print the manual steps and exit
          # cleanly rather than hang waiting on a prompt nobody can answer.
          grep -q "no terminal available" out.txt
          grep -q "auth login" out.txt
          grep -q "workspace use" out.txt
          echo "guided setup degraded correctly without a terminal"

      # Supplied credentials must win over whatever is already stored: a console
      # hands out a key for a reason, and silently keeping a stale one would
      # leave the install pointing somewhere the user did not choose. The
      # success path needs a real key, so this asserts the ordering instead —
      # a rejected key proves the supplied one was *tried* rather than skipped
      # because credentials already existed.
      - name: Supplied credentials override what is already stored
        run: |
          set -eu
          config="$PWD/override-config"
          mkdir -p "$config"
          cat > "$config/credentials.toml" <<'CREDS'
          [profiles.default]
          api_key = "sk-stale-key-that-does-not-work"
          login_method = "api_key"
          CREDS
          cat > "$config/config.toml" <<'CONF'
          active_profile = "default"

          [profiles.default]
          workspace = "ws-stale"
          CONF

          MEMORYLAKE_CONFIG_DIR="$config" MEMORYLAKE_INSTALL_DIR="$PWD/testbin3" \
            sh scripts/install.sh --api-key sk-definitely-not-valid | tee out3.txt

          # The stale key must not have been treated as "already logged in".
          if grep -q "already logged in" out3.txt; then
            echo "a supplied key was skipped in favour of stored credentials"; exit 1
          fi
          grep -q "was not accepted" out3.txt
          echo "supplied credentials take precedence over stored ones"

      - name: Setup can be opted out of entirely
        run: |
          set -eu
          MEMORYLAKE_NO_SETUP=1 MEMORYLAKE_INSTALL_DIR="$PWD/testbin2" \
            sh scripts/install.sh | tee out2.txt
          if grep -q "no terminal available" out2.txt; then
            echo "MEMORYLAKE_NO_SETUP should skip setup silently"; exit 1
          fi

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Everything that needs no network. The live tests run once, in `coverage` —
  # see the note there.
  #
  # No API key is set, so a live test that slipped in here would fail loudly
  # rather than quietly reaching production from two jobs at once.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (no network)
        run: |
          cargo test -p memorylake-core --lib
          cargo test -p memorylake-cli -- --skip live

  # Windows is a release target but not a test platform: this proves the crate
  # still builds and its platform-independent behaviour holds there, so a broken
  # Windows build surfaces on the PR rather than when a release tag is pushed.
  #
  # Live tests are skipped rather than run with a key: they create real objects,
  # and doing that from a second platform would double the scratch state every
  # CI run leaves behind for no extra signal.
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p memorylake-cli
      - name: Test (core, no network)
        run: cargo test -p memorylake-core --lib
      - name: Test (CLI, offline and wire only)
        run: cargo test -p memorylake-cli -- --skip live

      # The PowerShell installer runs on users' machines via `irm | iex`, so it
      # is checked where it actually runs: parsing, the checksum gate, and — in
      # the steps below — a real end-to-end install under both PowerShell hosts.
      # Parse under Windows PowerShell 5.1 as well as 7. Their parsers differ:
      # a command missing its final argument, with a `function … {` on the next
      # line, parses cleanly under 7 and fails under 5.1, which swallows the
      # function header as an argument and then cannot find a closing brace.
      # That shipped once because only 7 was checked here.
      - name: Parse scripts/install.ps1 under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "host: $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts\install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host "parse error: $_" }; exit 1 }
          Write-Host 'install.ps1 parses cleanly under 5.1'

      - name: Validate scripts/install.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host "parse error: $_" }; exit 1 }
          Write-Host 'install.ps1 parses cleanly'

          # Load the functions without running the installer: strip the final
          # entry-point call, then dot-source what is left.
          $src = (Get-Content scripts/install.ps1 -Raw) -replace '(?m)^Install-Memorylake\s*$', ''
          . ([scriptblock]::Create($src))

          New-Item -ItemType Directory -Path ck -Force | Out-Null
          Set-Content ck/a.zip 'payload' -NoNewline
          $hash = (Get-FileHash ck/a.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  a.zip" | Out-File ck/a.zip.sha256 -Encoding ascii -NoNewline

          Test-Checksum (Resolve-Path ck/a.zip) (Resolve-Path ck/a.zip.sha256)
          Write-Host 'intact archive: accepted'

          Set-Content ck/a.zip 'tampered' -NoNewline
          $rejected = $false
          try { Test-Checksum (Resolve-Path ck/a.zip) (Resolve-Path ck/a.zip.sha256) }
          catch { $rejected = $true }
          if (-not $rejected) { Write-Host 'tampered archive was accepted'; exit 1 }
          Write-Host 'tampered archive: rejected'

      # Install for real, from the published release, under **Windows PowerShell
      # 5.1** — the host most Windows users get by double-clicking "PowerShell",
      # and a different runtime from pwsh 7. Skipping it is how an installer that
      # only works on 7 shipped once already: 5.1 runs on .NET Framework, where
      # the .NET Core APIs for architecture detection and response headers are
      # simply absent.
      #
      # MEMORYLAKE_NO_SETUP keeps the guided login out of it; a runner has no
      # credentials and setup is covered by the Unix job.
      - name: Install end to end (Windows PowerShell 5.1)
        shell: powershell
        env:
          MEMORYLAKE_NO_SETUP: '1'
          MEMORYLAKE_INSTALL_DIR: ${{ github.workspace }}\ps51
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "host: $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"
          .\scripts\install.ps1
          & "$env:MEMORYLAKE_INSTALL_DIR\memorylake.exe" --version
          & "$env:MEMORYLAKE_INSTALL_DIR\memorylake.exe" workspace use --help | Select-Object -First 1

      - name: Install end to end (PowerShell 7)
        shell: pwsh
        env:
          MEMORYLAKE_NO_SETUP: '1'
          MEMORYLAKE_INSTALL_DIR: ${{ github.workspace }}\ps7
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "host: $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"
          .\scripts\install.ps1
          & "$env:MEMORYLAKE_INSTALL_DIR\memorylake.exe" --version

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      MEMORYLAKE_API_KEY: ${{ secrets.MEMORYLAKE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The only job that runs the live tests, and so the only one that talks to
      # production. They used to run here *and* in `test`, concurrently, against
      # the same account — which failed at the connection level often enough to
      # need a rerun most times. Running them once fixes that and halves the
      # scratch state each CI run leaves behind (see #15).
      #
      # They stay in this job rather than the other because they are worth ~9
      # points of coverage: they reach paging, chunked upload and error paths
      # that the stub-backed tests do not. A live failure therefore surfaces
      # here — that is deliberate, not a misplaced test.
      - name: Generate coverage (includes the live tests)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
          slug: memorylake-ai/memorylake-cli
