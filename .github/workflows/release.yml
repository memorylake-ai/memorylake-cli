name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Stamp the tag into the binary so `memorylake version` reports which
      # release it is. Without this every build claims the crate version, which
      # has been 0.1.0 since the first release and cannot distinguish an
      # upgraded install from a stale one.
      - name: Build
        env:
          MEMORYLAKE_RELEASE: ${{ github.ref_name }}
        run: cargo build --release -p memorylake-cli --target ${{ matrix.target }}
      # Unix ships .tar.gz; Windows ships .zip, which Expand-Archive handles
      # natively so the PowerShell installer needs no external tools.
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          name="memorylake-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/memorylake" "$name/"
          cp README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "memorylake-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/memorylake.exe" $name
          Copy-Item README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          # Match the `shasum` format the Unix assets use, so both installers
          # parse the checksum file the same way.
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -FilePath "$name.zip.sha256" -Encoding ascii -NoNewline
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memorylake-${{ matrix.target }}
          path: |
            memorylake-*.tar.gz
            memorylake-*.tar.gz.sha256
            memorylake-*.zip
            memorylake-*.zip.sha256

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            memorylake-*.tar.gz
            memorylake-*.tar.gz.sha256
            memorylake-*.zip
            memorylake-*.zip.sha256
          generate_release_notes: true
