[workspace]
resolver = "2"
members = ["crates/cli", "crates/core"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/memorylake/memorylake-cli"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
memorylake-core = { path = "crates/core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
