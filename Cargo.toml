[workspace]
resolver = "2"
members = ["crates/cli", "crates/core"]

[workspace.package]
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
repository = "https://github.com/memorylake/memorylake-cli"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dialoguer = "0.11"
dirs = "6"
libc = "0.2"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
memorylake-core = { path = "crates/core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
